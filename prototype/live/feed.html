<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Encore — TikTok LIVE Feed (3 rooms)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* TikTok LIVE feed shell — 3 stacked iframes, each one a streamer.html
     instance with a different game mode + host. Vertical scroll-snap gives
     the swipe-up/swipe-down feel. Each iframe also runs its own canvas
     scene + chat + Encore sheet, so the rooms are fully independent. */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* Mobile fix: use 100dvh (dynamic viewport height) instead of 100vh —
     100vh on mobile Safari INCLUDES the address bar height, so each
     iframe got allocated ~85px more than the visible area and the
     streamer's bottom bar / last chat row fell behind the URL bar.
     100dvh sizes to the actual visible viewport, no overlap. Desktop
     and Android Chrome both support dvh now. */
  #feed {
    width: 100vw;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  .room {
    width: 100vw;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    position: relative;
    background: #000;
  }
  .room iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
  }

  /* Right-side dot indicator — which room is in view */
  .dots {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 100;
    pointer-events: none;
  }
  .dot {
    width: 4px;
    height: 18px;
    border-radius: 2px;
    background: rgba(255,255,255,0.25);
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
    transition: background 0.25s, height 0.25s;
  }
  .dot.active {
    background: #fff;
    height: 26px;
  }

  /* Centered swipe hint — fades out after first scroll */
  .swipe-hint {
    position: fixed;
    left: 50%;
    bottom: 130px;
    transform: translateX(-50%);
    z-index: 100;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.4px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    animation: bob 1.8s ease-in-out infinite;
    transition: opacity 0.4s;
  }
  .swipe-hint .arrow {
    font-size: 20px;
    line-height: 1;
  }
  .swipe-hint.gone {
    opacity: 0;
  }
  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-8px); }
  }

  /* Small top-left label so it's obvious this is the feed shell */
  .feed-brand {
    position: fixed;
    left: 12px;
    top: 12px;
    z-index: 100;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: rgba(255,255,255,0.55);
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="feed">
  <!-- Room 1 · FPS — Vietnamese streamer (existing chat pool flavor) -->
  <section class="room" data-room="0">
    <iframe data-src="streamer.html?mode=fps&feed=1&host=TK%20S%C3%B3i&hearts=118.1K&viewers=476"
            loading="eager"
            allow="autoplay; fullscreen"></iframe>
  </section>

  <!-- Room 2 · GTA-style — night driver -->
  <section class="room" data-room="1">
    <iframe data-src="streamer.html?mode=gta&feed=1&host=RoadKing88&hearts=89.4K&viewers=312"
            loading="lazy"
            allow="autoplay; fullscreen"></iframe>
  </section>

  <!-- Room 3 · Roblox-style — parkour streamer -->
  <section class="room" data-room="2">
    <iframe data-src="streamer.html?mode=roblox&feed=1&host=PixelMax&hearts=204.8K&viewers=921"
            loading="lazy"
            allow="autoplay; fullscreen"></iframe>
  </section>
</div>

<div class="feed-brand">FOR YOU · LIVE</div>

<div class="dots" id="dots">
  <div class="dot active"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<div class="swipe-hint" id="hint">
  <span class="arrow">↑</span>
  <span>Swipe for next LIVE</span>
</div>

<script>
(() => {
  const feed   = document.getElementById('feed');
  const dots   = [...document.querySelectorAll('#dots .dot')];
  const hint   = document.getElementById('hint');
  const frames = [...document.querySelectorAll('.room iframe')];

  // Eager-load room 0 only; rooms 1 & 2 load when they become the neighbor
  // of the in-view room (saves a 3-up canvas RAF + chat init burst on entry).
  const loaded = new Set();
  function loadRoom(i) {
    if (i < 0 || i >= frames.length || loaded.has(i)) return;
    frames[i].src = frames[i].dataset.src;
    loaded.add(i);
  }
  loadRoom(0);

  // Mobile fix: use feed.clientHeight (the scroll container's actual
  // visible height, locked to 100dvh) instead of window.innerHeight,
  // which on mobile Safari drifts as the URL bar hides/shows during
  // scroll. Drift was causing the round() snap target to lag by a
  // partial-page and the wrong room would briefly show as active.
  const roomH = () => feed.clientHeight;

  let lastIdx = 0;
  let scrollRAF = null;
  feed.addEventListener('scroll', () => {
    if (scrollRAF) return;
    scrollRAF = requestAnimationFrame(() => {
      scrollRAF = null;
      const idx = Math.round(feed.scrollTop / roomH());
      if (idx !== lastIdx) {
        lastIdx = idx;
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        hint.classList.add('gone');
      }
      // Preload neighbors as we scroll
      loadRoom(idx);
      loadRoom(idx + 1);
      loadRoom(idx - 1);
    });
  });

  // Fade hint after a few seconds even if user hasn't scrolled yet
  setTimeout(() => hint.classList.add('gone'), 6000);

  // Wheel scroll on desktop snaps page-by-page (browser native scroll-snap
  // handles touch swipe; wheel needs a tiny nudge to feel TikTok-like)
  let wheelLock = false;
  feed.addEventListener('wheel', (e) => {
    if (wheelLock) { e.preventDefault(); return; }
    if (Math.abs(e.deltaY) < 8) return;
    wheelLock = true;
    const dir = e.deltaY > 0 ? 1 : -1;
    const next = Math.max(0, Math.min(frames.length - 1, lastIdx + dir));
    feed.scrollTo({ top: next * roomH(), behavior: 'smooth' });
    setTimeout(() => { wheelLock = false; }, 500);
    e.preventDefault();
  }, { passive: false });

  // Keyboard ↑ / ↓ / PageUp / PageDown for desktop demo convenience
  window.addEventListener('keydown', (e) => {
    let dir = 0;
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') dir = 1;
    if (e.key === 'ArrowUp'   || e.key === 'PageUp')                    dir = -1;
    if (!dir) return;
    const next = Math.max(0, Math.min(frames.length - 1, lastIdx + dir));
    feed.scrollTo({ top: next * roomH(), behavior: 'smooth' });
    e.preventDefault();
  });

  // Re-snap to current room if viewport size changes mid-session
  // (Safari URL-bar toggle, orientation change). Otherwise scrollTop
  // sits at the wrong offset and the user sees a half-room.
  let resizeRAF = null;
  window.addEventListener('resize', () => {
    if (resizeRAF) cancelAnimationFrame(resizeRAF);
    resizeRAF = requestAnimationFrame(() => {
      feed.scrollTo({ top: lastIdx * roomH(), behavior: 'auto' });
    });
  });
})();
</script>

</body>
</html>
